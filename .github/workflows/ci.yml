name: Local validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orders
          POSTGRES_DB: smoke
          POSTGRES_PASSWORD: local-smoke-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orders -d smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Install test dependencies
        run: python -m pip install -r app/user-service/requirements.txt -r requirements-test.txt
      - name: Run service tests in isolated processes
        run: |
          for service in api-gateway user-service restaurant-service order-service payment-service notification-service; do
            (cd "app/$service" && python -m pytest tests -q -W error) || exit 1
          done
      - name: Exercise services with temporary PostgreSQL
        env:
          DATABASE_URL: postgresql://orders:local-smoke-only@127.0.0.1:5432/smoke
          PYTHONWARNINGS: error
        run: python scripts/local_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Validate local Compose configuration
        run: docker compose config --quiet
      - name: Lint and render Helm chart without a cluster
        run: |
          helm lint helm/order-management
          helm template local helm/order-management >/dev/null
