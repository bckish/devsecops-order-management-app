# Disposable local Kind fixture only. Sample values are not production credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: order-local
data:
  01-schema.sql: 'CREATE TABLE IF NOT EXISTS users(id SERIAL PRIMARY KEY,email TEXT
    UNIQUE NOT NULL,password_hash TEXT NOT NULL,role TEXT NOT NULL CHECK(role IN (''USER'',''ADMIN'',''RESTAURANT'')),created_at
    TIMESTAMPTZ NOT NULL DEFAULT now());

    CREATE TABLE IF NOT EXISTS restaurants(id SERIAL PRIMARY KEY,name TEXT NOT NULL,address
    TEXT NOT NULL,cuisine TEXT NOT NULL,created_at TIMESTAMPTZ NOT NULL DEFAULT now());

    CREATE TABLE IF NOT EXISTS menu_items(id SERIAL PRIMARY KEY,restaurant_id INT
    NOT NULL REFERENCES restaurants(id) ON DELETE CASCADE,name TEXT NOT NULL,price
    NUMERIC(10,2) NOT NULL CHECK(price>0),available BOOLEAN NOT NULL DEFAULT true,created_at
    TIMESTAMPTZ NOT NULL DEFAULT now());

    CREATE TABLE IF NOT EXISTS orders(id SERIAL PRIMARY KEY,user_id INT NOT NULL REFERENCES
    users(id),restaurant_id INT NOT NULL REFERENCES restaurants(id),status TEXT NOT
    NULL CHECK(status IN (''CREATED'',''PAID'',''PREPARING'',''OUT_FOR_DELIVERY'',''DELIVERED'',''CANCELLED'')),total_amount
    NUMERIC(10,2) NOT NULL CHECK(total_amount>=0),created_at TIMESTAMPTZ NOT NULL
    DEFAULT now());

    CREATE TABLE IF NOT EXISTS order_items(id SERIAL PRIMARY KEY,order_id INT NOT
    NULL REFERENCES orders(id) ON DELETE CASCADE,menu_item_id INT NOT NULL REFERENCES
    menu_items(id),quantity INT NOT NULL CHECK(quantity>0));

    CREATE TABLE IF NOT EXISTS payments(id SERIAL PRIMARY KEY,order_id INT NOT NULL
    REFERENCES orders(id) ON DELETE CASCADE,amount NUMERIC(10,2) NOT NULL,status TEXT
    NOT NULL,method TEXT NOT NULL,created_at TIMESTAMPTZ NOT NULL DEFAULT now());

    CREATE TABLE IF NOT EXISTS notifications(id SERIAL PRIMARY KEY,order_id INT NOT
    NULL REFERENCES orders(id) ON DELETE CASCADE,channel TEXT NOT NULL,message TEXT
    NOT NULL,status TEXT NOT NULL,created_at TIMESTAMPTZ NOT NULL DEFAULT now());

    CREATE INDEX IF NOT EXISTS idx_orders_user_created ON orders(user_id,created_at
    DESC); CREATE INDEX IF NOT EXISTS idx_menu_restaurant ON menu_items(restaurant_id);
    CREATE INDEX IF NOT EXISTS idx_notifications_order ON notifications(order_id);

    '
  02-seed.sql: 'INSERT INTO restaurants(name,address,cuisine) VALUES (''Spice Hub'',''MG
    Road'',''Indian''),(''Green Bowl'',''Indiranagar'',''Healthy'') ON CONFLICT DO
    NOTHING;

    INSERT INTO menu_items(restaurant_id,name,price) SELECT id,''Paneer Bowl'',249
    FROM restaurants WHERE name=''Spice Hub'' AND NOT EXISTS(SELECT 1 FROM menu_items
    WHERE name=''Paneer Bowl'');

    INSERT INTO menu_items(restaurant_id,name,price) SELECT id,''Veg Biryani'',199
    FROM restaurants WHERE name=''Spice Hub'' AND NOT EXISTS(SELECT 1 FROM menu_items
    WHERE name=''Veg Biryani'');

    INSERT INTO menu_items(restaurant_id,name,price) SELECT id,''Avocado Salad'',299
    FROM restaurants WHERE name=''Green Bowl'' AND NOT EXISTS(SELECT 1 FROM menu_items
    WHERE name=''Avocado Salad'');

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: order-local
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: order-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: orders
        - name: POSTGRES_USER
          value: orders
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - orders
            - -d
            - orders
          initialDelaySeconds: 10
          periodSeconds: 10
        imagePullPolicy: Never
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: order-local
type: Opaque
stringData:
  POSTGRES_PASSWORD: local-smoke-only
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: order-local
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: order-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsUser: 999
        imagePullPolicy: Never
        command:
        - redis-server
        - --save
        - ''
        - --appendonly
        - 'no'
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: order-local
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: order-local
type: Opaque
stringData:
  DATABASE_URL: postgresql://orders:local-smoke-only@postgres:5432/orders
  JWT_SECRET: local-gitops-runtime-smoke
  REDIS_URL: redis://redis:6379/0
